name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/abm-platform-dev-zvsl59]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Middleware only makes sense on a Node server (Vercel); GitHub Pages is
      # static file hosting, and `output: "export"` refuses to build with a
      # middleware.ts present. It no-ops without Supabase env vars anyway.
      - run: rm -f middleware.ts

      - run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
